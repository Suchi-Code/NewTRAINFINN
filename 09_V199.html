<script>
/* ============================================================
   HELPERS
   ============================================================ */
/* วันที่ไทย — logic ย้ายไปรวมที่ js/date-th.js แล้ว (DateTH.normalize/format/formatRange ใช้
   getUTCHours()/getUTCFullYear() เท่านั้น ชดเชย timezone +7 ให้ถูกต้องเสมอ ไม่ขึ้นกับ timezone
   ของเครื่อง/เบราว์เซอร์ผู้ใช้) — ของเดิม toISODate() ใช้ Date methods แบบ local (getFullYear/
   getMonth/getDate) เสี่ยงวันที่เพี้ยนไป 1 วันตาม timezone เครื่อง (ดู gotcha 6.5 ในคู่มือ)
   เก็บชื่อฟังก์ชันเดิมไว้เป็น wrapper บางๆ กันไม่ต้องแก้จุดเรียกใช้ทั้งไฟล์ (ไม่มีจุดใดใช้ short=true) */
function fmtDate(d, short){
  return DateTH.format(d, { month: short ? 'short' : 'long' });
}
function fmtDateRange(s, e){
  return DateTH.formatRange(s, e);
}
function fmtMoney(n){
  const v = parseFloat(n)||0;
  return v.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtMoney2(n){
  const v = parseFloat(n)||0;
  return v===0 ? '-' : v.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
}
const gv = id => (document.getElementById(id)?.value?.trim()||'');

function toISODate(v){
  return DateTH.normalize(v);
}

/* ============================================================
   ROWS STATE (data only — ไม่มี editable DOM table อีกต่อไป)
   ============================================================ */
let editRows = [];   // [{seq,doc,name,branch,taxid,addr,date,acct,val,vat,wht,total}, ...]

function buildAddr(d){
  const parts = [];
  if(d.addr1)    parts.push(d.addr1);
  const sub = [
    d.tambon   ? 'ต.'+d.tambon   : '',
    d.amphoe   ? 'อ.'+d.amphoe   : '',
    d.province ? 'จ.'+d.province : '',
    d.zip      || ''
  ].filter(Boolean).join(' ');
  if(sub) parts.push(sub);
  return parts.join(' ');
}

function esc(s){
  return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ============================================================
   GOOGLE SHEET API — gsApi/showGsLoader/hideGsLoader/showGsStatus
   ย้ายไปรวมที่ js/gas-api.js แล้ว (shared กับทุกไฟล์)
   ⚠️ gsApi ของ shared เป็นแบบ swallow-return-null (คืน null เมื่อผิดพลาด ไม่ throw)
   จุดเรียกใช้ด้านล่างเช็ค `if (!gsRow)` อยู่แล้ว ใช้ pattern เดียวกันได้เลยไม่ต้องแก้
   ============================================================ */

/* ============================================================
   หมวดรายการ — ย้ายไปใช้ SchemaTH (js/schema.js) แล้ว แทนก้อน SEC_OPTS/DYNAMIC_SEC_ORDER
   ที่เคยก็อปวางซ้ำจากไฟล์ 06 (แก้บั๊กสำคัญ: ของเดิมใช้รหัสหมวดแบบเก่า '1'/'2'/'3'/'4'
   ซึ่งไม่ตรงกับที่ไฟล์ 06 เขียนจริงหลัง refactor (SchemaTH.SEC.OFFICE='office' ฯลฯ) ทำให้
   แถวหมวดวัสดุสำนักงาน/วัสดุเบ็ดเตล็ด/อาหาร/เดินทางเจ้าหน้าที่ที่ติ๊ก ว.119 ไม่เคยถูกดึงมา
   แสดงเลยอย่างเงียบๆ — ดู bug ledger #11/#12 ที่แก้จุดเดียวกันในไฟล์ 07 ไปแล้ว)
   ============================================================ */
const SEC_OPTS          = SchemaTH.SEC_OPTS;
const DYNAMIC_SEC_ORDER = SchemaTH.DYNAMIC_SEC_ORDER;

// toggle + budget ดิบจากไฟล์ 05 — ใช้ตัดสินว่าหมวดไหน "ตั้งงบประมาณไว้" เพื่อคำนวณเลขข้อให้ตรงกับรายงานสรุป
// (BUDGET05 จำเป็นสำหรับ SchemaTH.getActiveSections ตัวที่ 3 — ครอบคลุม extHasAmount fix ด้วย)
let BUDGET05 = null;
let BUDGET05_TOGGLES = null;

/* หมวดที่ "ตั้งงบประมาณไว้" ตามไฟล์ 05 — ถ้ายังไม่มีข้อมูลงบ fallback ไปใช้หมวดที่มีรายการจริงในชุดข้อมูลที่ส่งเข้ามา
   (ตัวจัดการจริงคือ SchemaTH.getActiveSections(rows, toggles, budget) — ตรงกับไฟล์ 06/09 เป๊ะ) */
function getActiveSections(rows){
  return SchemaTH.getActiveSections(rows, BUDGET05_TOGGLES, BUDGET05);
}

// คำนวณเลขข้อ "1., 2., 3..." แบบ dynamic ตามลำดับ DYNAMIC_SEC_ORDER — ต้องให้ผลลัพธ์ตรงกับไฟล์ 06
function computeMajorNumbers(rows){
  const present = getActiveSections(rows);
  const nums = {};
  let n = 0;
  DYNAMIC_SEC_ORDER.forEach(sec=>{
    if(present.has(sec)){ n++; nums[sec] = String(n); }
  });
  return nums;
}

// เลขข้อของแต่ละหมวด คำนวณครั้งเดียวตอนโหลดข้อมูล (key = sec, value = "1"/"2"/...)
let SECTION_NUMS = {};

/* ============================================================
   LEGACY CODE MIGRATION — actual06.rowsJson ของคอร์สที่บันทึกไว้ "ก่อน" ไฟล์ 06 ย้ายไปใช้
   SchemaTH ยังเป็นรหัสหมวดแบบเก่า ('1','2','3','4') — แปลงตอนอ่านเข้ามาเท่านั้น (lazy migration
   แบบเดียวกับ migrateLegacyRow06/07 ไม่ batch-migrate ข้อมูลใน Sheet จริง) ก่อนนำไปกรอง/นับหมวด
   09 ใช้แค่ sec สำหรับจัดกลุ่ม/หาเลขข้อ ไม่ได้ใช้ sub เลย จึงไม่ต้อง map sub เหมือน 07
   ============================================================ */
const LEGACY_SEC09_MAP = {
  '1': SchemaTH.SEC.OFFICE, '2': SchemaTH.SEC.MISC, '3': SchemaTH.SEC.FOOD, '4': SchemaTH.SEC.STAFF_TRAVEL,
};
function migrateLegacyRow09(r){
  if (r && r.sec && LEGACY_SEC09_MAP[r.sec] !== undefined) r.sec = LEGACY_SEC09_MAP[r.sec];
  return r;
}

/* ============================================================
   โหลดข้อมูลจาก Google Sheet — key คือ "เลขที่หลักสูตร" (no)
   ============================================================ */
async function loadFromGSheet09(no){
  if(!no){
    document.getElementById('doc-display').innerHTML =
      '<div style="text-align:center;padding:40px;color:#888">⚠️ ไม่พบเลขที่หลักสูตร กรุณาเข้าจากหน้ารายการหลักสูตร</div>';
    return;
  }
  showGsLoader('📥 กำลังโหลดข้อมูล');
  try{
    const gsRow = await gsApi('getByNo', null, no);
    console.log('[09] gsRow:', gsRow);
    if(!gsRow){
      hideGsLoader();
      showGsStatus('⚠️ ไม่พบข้อมูลสำหรับเลขที่ ' + no, 'warn');
      document.getElementById('doc-display').innerHTML =
        '<div style="text-align:center;padding:40px;color:#888">⚠️ ไม่พบข้อมูลสำหรับเลขที่หลักสูตร ' + esc(no) + '</div>';
      return;
    }

    const cr = gsRow.course   || {};
    const g6 = gsRow.actual06 || {};
    const bd = gsRow.budget   || null;

    // ── parse toggle + เก็บ budget ดิบจากไฟล์ 05 (ถ้ามี) ไว้คำนวณเลขข้อให้ตรงกับรายงานสรุป ──
    BUDGET05 = bd;
    BUDGET05_TOGGLES = null;
    if (bd && bd.spkJson) {
      try { BUDGET05_TOGGLES = typeof bd.spkJson === 'string' ? JSON.parse(bd.spkJson) : bd.spkJson; }
      catch(e) { BUDGET05_TOGGLES = null; }
    }

    // ── เติมข้อมูลหลักสูตรลง input-panel (read-only display) ──
    // วันที่: รองรับหลายตำแหน่งที่อาจมาจาก backend (cr.dateStart/dateEnd เป็นหลัก
    // แต่กันเหนียวกรณี backend ส่งมาที่ระดับบนสุดของ gsRow หรือใน actual06 แทน)
    const title    = cr.course    || '';
    const run      = cr.batch     || '';
    const runno    = cr.no        || no;
    const dateS    = toISODate(cr.dateStart || gsRow.dateStart || g6.dateStart || '');
    const dateE    = toISODate(cr.dateEnd   || gsRow.dateEnd   || g6.dateEnd   || '');
    const location = cr.location  || '';

    if(document.getElementById('f_title'))    document.getElementById('f_title').value    = title;
    if(document.getElementById('f_run'))      document.getElementById('f_run').value       = run;
    if(document.getElementById('f_runno'))    document.getElementById('f_runno').value     = runno;
    if(document.getElementById('f_date'))     document.getElementById('f_date').value      = dateS;
    if(document.getElementById('f_date_end')) document.getElementById('f_date_end').value  = dateE;
    if(document.getElementById('f_location')) document.getElementById('f_location').value  = location;

    // ── กรองเฉพาะรายการที่ติ๊ก "ค่าใช้จ่ายตาม ว.119" (w119) จาก actual06.rowsJson ──
    // หมายเหตุ: ไฟล์ 06 บันทึกคอลัมน์ "rowsJson" เป็น JSON string (ไม่ใช่ "rows")
    // ต้อง parse ก่อนใช้งาน และรองรับกรณี backend คืนมาเป็น array อยู่แล้ว
    let allRows = [];
    const rawRows = g6.rowsJson ?? g6.rows ?? [];
    if(typeof rawRows === 'string'){
      try{ allRows = JSON.parse(rawRows || '[]'); }catch(e){ allRows = []; console.warn('[09] rowsJson parse error:', e); }
    } else if(Array.isArray(rawRows)){
      allRows = rawRows;
    }
    // normalize รหัสหมวดเก่า→ใหม่ (LEGACY_SEC09_MAP) ก่อนใช้งานเสมอ — เผื่อคอร์สนี้ยังไม่เคย
    // ถูกบันทึกซ้ำด้วยไฟล์ 06 เวอร์ชันใหม่ (ดู bug ledger #12)
    allRows = allRows.map(migrateLegacyRow09);

    // เลขข้อ "1., 2., 3..." คำนวณจากหมวดที่ตั้งงบไว้ทั้งหมด (ไม่ใช่แค่ที่ติ๊ก ว.119) เพื่อให้ตรงกับรายงานสรุป (ไฟล์ 06)
    SECTION_NUMS = computeMajorNumbers(allRows);

    editRows = allRows.filter(r=>r.w119===true || r.w119==='true').map(r=>{
      // กันเหนียว: ใช้ staff เฉพาะตอนเป็นหมวดค่าเดินทางเจ้าหน้าที่เท่านั้น
      // ป้องกัน bug เดิมจากไฟล์ 06 ที่ select เจ้าหน้าที่ติดค่า default มาทุกแถว
      const nameVal = r.name || (r.sec === SchemaTH.SEC.STAFF_TRAVEL ? (r.staff||'') : '');
      const secLabel = (SEC_OPTS.find(s=>s.v===r.sec)?.l) || '';
      return {
        sec   : r.sec    || '',
        secNum: SECTION_NUMS[r.sec] || '',
        secLabel,
        doc   : r.doc    || '',
        name  : nameVal,
        branch: r.branch || '',
        addr  : r.addr   || buildAddr(r),
        taxid : r.taxid  || '',
        date  : r.date   || '',
        acct  : r.acct   || '',
        val   : parseFloat(r.val)   || 0,
        vat   : parseFloat(r.vat)   || 0,
        wht   : parseFloat(r.wht)   || 0,
        total : parseFloat(r.total) || ((parseFloat(r.val)||0)+(parseFloat(r.vat)||0)-(parseFloat(r.wht)||0)),
      };
    });

    hideGsLoader();
    if(editRows.length===0){
      showGsStatus('⚠️ ไม่พบรายการ "ค่าใช้จ่ายตาม ว.119"', 'warn');
    } else {
      showGsStatus('✅ โหลดข้อมูลสำเร็จ', 'ok');
    }

    renderDocDisplay();
  }catch(e){
    hideGsLoader();
    showGsStatus('❌ โหลดไม่สำเร็จ: ' + e.message, 'error');
    console.error('[09] loadFromGSheet09 error:', e);
  }
}

/* ============================================================
   AUTO-LOAD ON PAGE ENTER — key จาก sessionStorage (ไฟล์ 01 ส่งมา)
   ============================================================ */
function autoLoadFromFile01(){
  let slot={};
  try{
    const raw = sessionStorage.getItem('budgetSlotData') || localStorage.getItem('budgetSlotData');
    if(raw) slot = JSON.parse(raw);
    else slot = JSON.parse(sessionStorage.getItem('courseData')||'{}');
  }catch(e){}

  const no = slot.no || slot.courseNo || '';
  loadFromGSheet09(no);
}

/* ============================================================
   BUILD PRINT DOCUMENT HTML
   ============================================================ */
function buildDocHtml(){
  const title    = gv('f_title');
  const run      = gv('f_run');
  const runno    = gv('f_runno');
  const dateStr  = fmtDateRange(gv('f_date'), gv('f_date_end'));
  const location = gv('f_location');

  // จัดเรียงแถวตามลำดับหมวดของ DYNAMIC_SEC_ORDER ก่อน (ให้กลุ่มหมวดเรียงตรงกับรายงานสรุป)
  // แล้วค่อยเลขลำดับที่ต่อเนื่องกันทั้งชุด
  const secOrderIdx = sec => { const i = DYNAMIC_SEC_ORDER.indexOf(sec); return i===-1 ? 999 : i; };
  const sortedRows = [...editRows].sort((a,b)=> secOrderIdx(a.sec)-secOrderIdx(b.sec));

  const rows = sortedRows.map((r,i)=>({
    seq   : i+1,
    sec   : r.sec||'',
    secNum: r.secNum||'',
    secLabel: r.secLabel||'',
    doc   : r.doc||'',
    name  : r.name||'',
    branch: r.branch||'',
    addr  : r.addr||'',
    taxid : r.taxid||'',
    date  : r.date||'',
    acct  : r.acct||'',
    val   : r.val||0,
    vat   : r.vat||0,
    wht   : r.wht||0,
    total : r.total||0,
  }));

  let gVal=0,gVat=0,gWht=0,gTotal=0;
  rows.forEach(r=>{gVal+=r.val;gVat+=r.vat;gWht+=r.wht;gTotal+=r.total;});

  // ซ่อนคอลัมน์ "ภาษีหัก ณ ที่จ่าย" ทั้งคอลัมน์ ถ้าไม่มีรายการใดมีค่าเลย (0 หรือไม่ระบุ)
  const hasWht = rows.some(r => (parseFloat(r.wht)||0) > 0);
  const colCount = hasWht ? 7 : 6;
  const itemColWidth = hasWht ? 44 : 54;

  /* ---- แถวข้อมูล (แทรกหัวข้อหมวดตามที่ติ๊ก ว.119 จริง) ---- */
  let bodyHtml='';
  if(rows.length===0){
    bodyHtml=`<tr><td colspan="${colCount}" style="text-align:center;padding:16px;color:#888;font-style:italic;">ไม่มีรายการ</td></tr>`;
  } else {
    let lastSec = null;
    rows.forEach(r=>{
      if(r.sec !== lastSec){
        const num = r.secNum ? r.secNum + '. ' : '';
        bodyHtml += `<tr class="row-sub"><td colspan="${colCount}">${num}${r.secLabel} (ว.119)</td></tr>`;
        lastSec = r.sec;
      }
      const detailLines=[];
      if(r.doc)    detailLines.push(r.doc);
      if(r.name)   detailLines.push(r.name);
      if(r.branch) detailLines.push(r.branch);
      if(r.taxid)  detailLines.push('เลขประจำตัวผู้เสียภาษี '+r.taxid);
      if(r.addr)   detailLines.push(r.addr);
      if(r.date)   detailLines.push('ลงวันที่ '+fmtDate(r.date));
      bodyHtml+=`<tr>
        <td class="tc">${r.seq}</td>
        <td class="tl" style="line-height:1.55">${detailLines.map(l=>`<div>${l}</div>`).join('')}</td>
        <td class="tc">${r.acct}</td>
        <td class="tr">${fmtMoney(r.val)}</td>
        <td class="tr">${fmtMoney2(r.vat)}</td>
        ${hasWht ? `<td class="tr">${fmtMoney2(r.wht)}</td>` : ''}
        <td class="tr">${fmtMoney(r.total)}</td>
      </tr>`;
    });
  }

  return `<div class="doc-wrap">
<div class="doc-title">
  <input class="hdr-inp" id="ph_title" value="">
  <input class="hdr-inp" id="ph_title" value="รายละเอียดค่าใช้จ่ายกรณีจัดซื้อ / จัดจ้างพัสดุ">
  <input class="hdr-inp" id="ph_title" value="ที่เกี่ยวกับค่าใช้จ่ายในการบริหารงานที่มีวงเงินฯ ครั้งละไม่เกิน 10,000 บาท">
</div>
<div class="doc-meta">
  <input class="hdr-inp" id="ph_line1" value='หลักสูตร "${title}" รุ่นที่ ${run}'>
  <input class="hdr-inp" id="ph_line2" value="เลขที่รุ่นหลักสูตร ${runno}${dateStr?' ในวันที่ '+dateStr:''}">
  <input class="hdr-inp" id="ph_line3" value="${location?'ณ '+location:''}">
  <input class="hdr-inp" id="ph_line4" value="">
</div>

<table class="doc-table">
  <thead>
    <tr>
      <th style="width:6%">ลำดับที่</th>
      <th style="width:${itemColWidth}%" class="tl">รายการ</th>
      <th style="width:10%">รหัสบัญชี</th>
      <th style="width:10%">มูลค่าสินค้า</th>
      <th style="width:10%">ภาษีมูลค่าเพิ่ม</th>
      ${hasWht ? '<th style="width:10%">ภาษีหัก ณ ที่จ่าย</th>' : ''}
      <th style="width:10%">จำนวนเงิน</th>
    </tr>
  </thead>
  <tbody>
    <tr class="row-cat">
      <td colspan="${colCount}">ก. ค่าดำเนินการฝึกอบรม</td>
    </tr>
    ${bodyHtml}
    <tr class="row-grand">
      <td colspan="3" class="tc">รวมค่าใช้จ่ายตาม ว.119 ทั้งสิ้น</td>
      <td class="tr">${fmtMoney(gVal)}</td>
      <td class="tr">${fmtMoney2(gVat)}</td>
      ${hasWht ? `<td class="tr">${fmtMoney2(gWht)}</td>` : ''}
      <td class="tr">${fmtMoney(gTotal)}</td>
    </tr>
  </tbody>
</table>
</div>`;
}

function rebuildPreview(){
  renderDocDisplay();
}

/* ── SAVE PDF (ผ่าน Puppeteer server ฝั่ง backend — รูปแบบเดียวกับไฟล์ 05/06/07/08) ──
   PDF_SERVER_URL / Supabase client / อัปโหลด PDF — ย้ายไปรวมที่ js/gas-api.js แล้ว
   (ใช้ saveReportPdf(courseNo, 'pdf09', blob) ซึ่งอัปโหลดแบบ versioning
   (pdf09-v1.pdf, pdf09-v2.pdf, ... แยกโฟลเดอร์ตามเลขที่หลักสูตร ไม่ทับของเก่า) และเขียนลิงก์
   ล่าสุดกลับ Sheet คอลัมน์ pdf09/pdf09SavedAt ให้อัตโนมัติในตัว — แทนที่ html2canvas+jsPDF เดิม
   ที่ดาวน์โหลดลงเครื่องอย่างเดียว ไม่เคยมีการอัปโหลดขึ้น Supabase หรือเขียนลิงก์กลับ Sheet เลย */
async function savePdf(btn){
  const el = document.getElementById('doc-display');
  if(!el || !el.innerHTML.trim()){ alert('ไม่พบข้อมูลเอกสาร'); return; }

  const title  = gv('f_title') || 'ค่าวัสดุเบ็ดเตล็ด';
  const run    = gv('f_run')   || '';
  const runno  = gv('f_runno') || '';
  const safe   = s => s.replace(/[/\\:*?"<>|]/g,'_').trim();
  const fname  = safe(`วัสดุเบ็ดเตล็ด_${title}_รุ่น${run}_${runno}`) || 'sec2_misc';

  btn.disabled = true; btn.textContent = '⏳ กำลังสร้าง...';

  try {
    const clone = el.cloneNode(true);

    /* เอากรอบเทาจาง/padding/background ของ #doc-display (สำหรับแสดงผลบนหน้าจอ) ออก
       ไม่ให้ติดไปในเอกสารที่ส่งให้ Puppeteer render */
    clone.style.border       = 'none';
    clone.style.borderRadius = '0';
    clone.style.background   = 'transparent';
    clone.style.padding      = '0';
    clone.style.margin       = '0';
    clone.style.boxShadow    = 'none';

    /* แปลง input.hdr-inp (หัวเอกสารที่แก้ไขได้) → div ข้อความนิ่งๆ ก่อนส่งไป render
       (เก็บ inline style เดิมไว้ — ปรับ text-align/weight ให้ล้อของเดิม) */
    clone.querySelectorAll('input.hdr-inp').forEach(inp => {
      const d = document.createElement('div');
      d.style.cssText = 'font-family:Sarabun,sans-serif;font-size:13px;font-weight:700;color:#000;text-align:center;line-height:1.7;width:100%;';
      d.textContent = inp.value;
      inp.parentNode.replaceChild(d, inp);
    });

    // ✅ ดึง CSS หลักของหน้าเว็บทั้งดวง (นิยาม .doc-table, .row-cat, .row-sub, .row-grand ฯลฯ)
    // ไปแนบด้วย — ตารางจะได้เส้นขอบ/จัดหน้าตามที่ตั้งใจจาก Puppeteer render จริง (ไม่ต้องจำลอง
    // border/canvas-slicing แบบที่ html2canvas เดิมต้องทำ)
    const originalStyles = Array.from(document.querySelectorAll('style'))
      .map(s => s.innerHTML).join('\n');

    // ประกอบเป็นเอกสาร HTML ฉบับสมบูรณ์ ส่งให้ฝั่งเซิร์ฟเวอร์ (Puppeteer) เปิดแล้ว render เป็น PDF จริง
    const fullHtml = `<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
${originalStyles}
</style>
<style>
  /* Override เฉพาะสำหรับไฟล์ PDF (มาทีหลัง จึงมีลำดับความสำคัญสูงกว่า CSS หลักด้านบน) */
  * { box-sizing: border-box; }
  html,body { margin:0; padding:0; background:#fff; font-family:'Sarabun',sans-serif; color:#000; }
</style>
</head>
<body>${clone.outerHTML}</body>
</html>`;

    const res = await fetch(APP_CONFIG.PDF_SERVER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        html: fullHtml,
        filename: fname,
        // ✅ pdfOptions เฉพาะของไฟล์ 09 — ล้อ @page{size:A4 portrait;margin:0.5in 0.47in 0 0.47in} เดิมของไฟล์นี้
        pdfOptions: {
          format: 'A4',
          landscape: false,
          margin: { top: '12.7mm', right: '11.9mm', bottom: '5mm', left: '11.9mm' },
          preferCSSPageSize: true,
          printBackground: true,
        },
      })
    });
    if(!res.ok){
      const errText = await res.text().catch(()=>res.statusText);
      throw new Error(`เซิร์ฟเวอร์สร้าง PDF ผิดพลาด (${res.status}): ${errText}`);
    }

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = fname + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);

    // อัปโหลดขึ้น Supabase Storage แบบ versioning ผ่าน saveReportPdf() (js/gas-api.js) —
    // เก็บทุกเวอร์ชันไว้ (pdf09-v1.pdf, pdf09-v2.pdf, ...) ไม่ทับของเก่า และเขียนลิงก์ล่าสุด
    // กลับ Sheet คอลัมน์ pdf09/pdf09SavedAt ให้เองในตัว (ไม่ต้องเรียก gsApi ซ้ำเอง)
    btn.textContent = '⏳ กำลังอัปโหลด...';
    const courseNo = runno;
    const uploadResult = courseNo ? await saveReportPdf(courseNo, 'pdf09', blob) : null;
    if (uploadResult) {
      console.log('อัปโหลด PDF ขึ้น Supabase และบันทึกลิงก์กลับ Sheet สำเร็จ:', uploadResult.publicUrl, '(v' + uploadResult.version + ')');
    } else if (!courseNo) {
      showGsStatus('✅ ดาวน์โหลด PDF สำเร็จ (⚠️ ไม่พบเลขที่หลักสูตร จึงไม่ได้อัปโหลดขึ้น Supabase)', 'warn');
    } else {
      showGsStatus('⚠️ ดาวน์โหลด PDF สำเร็จ แต่อัปโหลดเก็บถาวรไม่สำเร็จ', 'warn');
    }

  } catch(err){
    console.error('savePdf09 error:', err);
    alert('สร้าง PDF ไม่สำเร็จ: ' + err.message + '\n\nตรวจสอบว่าเซิร์ฟเวอร์ Puppeteer เปิดใช้งานอยู่');
  } finally {
    btn.disabled = false; btn.textContent = '💾 บันทึก PDF';
  }
}
</script>
</body>
</html>
